{% extends "movies/base.html" %}

{% block content %}
<h2>Inscription</h2>
<form method="post" class="card p-4 shadow-sm w-50 mx-auto">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Créer un compte</button>
</form>
<p class="text-center mt-2">
    Déjà inscrit ? <a href="{% url 'login' %}">Connexion</a>
</p>
{% endblock %}
