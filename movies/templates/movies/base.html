<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineMercredi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'movies/css/style.css' %}">
</head>
<body>
<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div class="border-end bg-light" id="sidebar-wrapper">
        <div class="sidebar-heading text-center py-4 fs-4 fw-bold">FilmClub</div>
        <div class="list-group list-group-flush d-flex flex-column h-100">
            <div class="flex-grow-1">
                <a href="{% url 'film_list' %}" class="list-group-item list-group-item-action py-3">🎬 Mes films</a>
                <a href="{% url 'film_add' %}" class="list-group-item list-group-item-action py-3">➕ Ajouter un film</a>
                <a href="{% url 'classement' %}" class="list-group-item list-group-item-action py-3">🏆 Classement</a>
            </div>
            <div class="mt-auto">
                {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="list-group-item list-group-item-action py-3 text-danger">
                        🔓 Déconnexion
                    </button>
                </form>                
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="flex-grow-1 p-4">
        {% block content %}
        {% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
