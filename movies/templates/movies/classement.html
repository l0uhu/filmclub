{% extends "movies/base.html" %}
{% load static %}

{% block content %}
<h2>🏆 Les Oscars 🏆</h2>

<!-- Sélecteur d'année -->
<form method="get" class="mb-4 d-flex align-items-center">
    <label for="annee" class="me-2">Sélectionner l'année :</label>
    <select id="annee" name="annee" class="form-select w-auto me-2">
        {% for d in annees %}
            <option value="{{ d.year }}" {% if d.year|stringformat:"s" == annee_filter %}selected{% endif %}>
                {{ d.year }}
            </option>
        {% endfor %}
    </select>
    <button type="submit" class="btn btn-primary btn-sm">Filtrer</button>
</form>

<!-- Tableau du classement -->
<table class="table table-striped align-middle">
    <thead>
        <tr>
            <th>#</th>
            <th>Film</th>
            <th>Score moyen</th>
            <th>Vues</th>
        </tr>
    </thead>
    <tbody>
        {% for item in classement_films %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>
                {% if item.film.poster_url %}
                <img src="{{ item.film.poster_url }}" height="60" class="me-2 rounded">
                {% endif %}
                {{ item.titre }}
            </td>
            <td><strong>{{ item.score }}</strong></td>
            <td>{{ item.nb_viewers }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
